<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Cardiac Function Curves (Frank-Starling Relationship)</text>
  
  <!-- Grid Lines -->
  <line x1="80" y1="340" x2="540" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Dashed grid lines -->
  <line x1="80" y1="270" x2="540" y2="270" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="200" x2="540" y2="200" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="130" x2="540" y2="130" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Y-axis ticks and labels -->
  <text x="70" y="345" text-anchor="end" font-size="12" fill="#64748b">0</text>
  <text x="70" y="275" text-anchor="end" font-size="12" fill="#64748b">5</text>
  <text x="70" y="205" text-anchor="end" font-size="12" fill="#64748b">10</text>
  <text x="70" y="135" text-anchor="end" font-size="12" fill="#64748b">15</text>
  
  <!-- Y-axis Label -->
  <text x="25" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" transform="rotate(-90, 25, 200)">Cardiac Output (L/min)</text>
  
  <!-- X-axis ticks and labels -->
  <line x1="120" y1="340" x2="120" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="362" text-anchor="middle" font-size="12" fill="#64748b">-2</text>
  
  <line x1="200" y1="340" x2="200" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="362" text-anchor="middle" font-size="12" fill="#64748b">0</text>
  
  <line x1="280" y1="340" x2="280" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#64748b">2</text>
  
  <line x1="360" y1="340" x2="360" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#64748b">4</text>
  
  <line x1="440" y1="340" x2="440" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="362" text-anchor="middle" font-size="12" fill="#64748b">6</text>
  
  <line x1="520" y1="340" x2="520" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="362" text-anchor="middle" font-size="12" fill="#64748b">8</text>
  
  <!-- X-axis Label -->
  <text x="310" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Right Atrial Pressure (RAP, mmHg)</text>
  
  <!-- Normal Curve (Solid Blue Line) -->
  <path d="M 120 340 C 150 338, 180 290, 240 220 C 300 160, 360 160, 520 155" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  <text x="480" y="180" font-size="13" font-weight="600" fill="#2563eb">Normal</text>
  
  <!-- Enhanced Contractility Curve (Dashed Crimson Line) -->
  <path d="M 100 340 C 130 330, 160 230, 220 150 C 280 90, 340 85, 520 80" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="7,5" stroke-linecap="round"/>
  <text x="420" y="68" font-size="13" font-weight="bold" fill="#dc2626">Dashed line: Increased Contractility (+ Inotropic)</text>
  
  <!-- Arrow indicating shift -->
  <path d="M 270 190 L 250 145" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
